description: Win-Win (trywinwin.com) is a charitable-fundraising platform that gamifies giving. Participants
  compete in tournaments hosted by celebrities and influencers, predicting head-to-head matchup outcomes and
  making tax-deductible donations to charitable causes while climbing leaderboards to win prizes and experiences.
  Win-Win also offers B2B tooling for nonprofits and corporations to launch their own gamified fundraising
  campaigns, alongside a consumer mobile app. Surfaced as a 500 Global portfolio company. No public API or
  developer surface is currently published.
